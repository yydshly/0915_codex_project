name: Check project index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test project tooling
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Check project metadata and README
        run: python3 scripts/projects.py check
