<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Huashu Report：从约束到报告的制作方法</title><desc id="desc">样本统计、编辑判断、工程经验形成约束，约束指导六种内容原型、九种视觉方向、八种图表组件，再通过生成与核查完成报告。</desc><rect width="1200" height="650" fill="#f3f6f9"/><g font-family="Microsoft YaHei, sans-serif" fill="#152331"><text x="60" y="65" font-size="18" fill="#205cce">RESEARCH / 006 · HUASHU REPORT</text><text x="60" y="126" font-size="42" font-weight="700">专业报告格式的整理、约束与实现。</text><text x="60" y="168" font-size="20" fill="#596b7a">样式 · 字体 · 图片与图表 · 表格 · 分页</text><g fill="white" stroke="#d7e0e8"><rect x="60" y="210" width="340" height="123"/><rect x="430" y="210" width="340" height="123"/><rect x="800" y="210" width="340" height="123"/></g><g font-size="25" font-weight="700"><text x="84" y="253">样本统计</text><text x="454" y="253">编辑判断</text><text x="824" y="253">工程经验</text></g><g font-size="18" fill="#596b7a"><text x="84" y="294">41 份解剖数据 → 经验基线</text><text x="454" y="294">阅读任务 → 结构与证据要求</text><text x="824" y="294">排版故障 → 组件与检查器</text></g><path d="M230 333V362H970V333M600 362V398" stroke="#91aaca" stroke-width="2" fill="none"/><rect x="60" y="398" width="1080" height="156" fill="#152331"/><g fill="white"><g font-size="16" fill="#a7c2e5"><text x="90" y="442">内容结构</text><text x="350" y="442">视觉表达</text><text x="610" y="442">数据比较</text><text x="870" y="442">稳定交付</text></g><g font-size="29" font-weight="700"><text x="90" y="489">六种原型</text><text x="350" y="489">九种方向</text><text x="610" y="489">八种图表</text><text x="870" y="489">生成与核查</text></g><g font-size="16" fill="#c5d2e3"><text x="90" y="522">读者要用报告做什么</text><text x="350" y="522">配色、字体、版式</text><text x="610" y="522">读者要比较什么</text><text x="870" y="522">PDF 与可追溯数据</text></g></g><text x="60" y="609" font-size="16" fill="#596b7a">独立研究重绘 · 参考 alchaincyf/huashu-report · 区分统计事实、作者规则与本研究解释</text></g></svg>
