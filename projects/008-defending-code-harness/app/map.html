<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整思路总图｜Defending Code</title><meta name="description" content="一图对照直接 AI 审查与 Defending Code 的分工、完整闭环、工程增量、定制层次、能力边界和后续复用建议。"><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#e8ebe3;color:#233530;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#f5f3ed;border-bottom:1px solid #ccd5c5;padding:14px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}header a{color:#246953;text-underline-offset:4px;font-size:12px}h1{font-size:16px;margin:0;font-weight:600}.tools{display:flex;align-items:center;gap:8px}button{padding:7px 13px;background:#fffef9;border:1px solid #bccbb4;border-radius:3px;color:#246953;cursor:pointer;font:inherit;font-size:12px}button:disabled{opacity:.45;cursor:default}button:hover:not(:disabled){background:#e5ede0}button:focus-visible,a:focus-visible{outline:3px solid #ac4b29;outline-offset:3px}output{font-size:12px;min-width:43px;text-align:center}.board{overflow:auto;height:calc(100dvh - 88px);padding:20px;overscroll-behavior:contain}.board img{display:block;margin:0 auto;max-width:none;height:auto;box-shadow:0 3px 20px #23353010}small{font-size:11px;color:#59675f}.title-block{display:flex;flex-direction:column;gap:4px}footer{padding:8px 22px;font-size:11px;color:#59675f}@media(max-width:600px){header{padding:12px;gap:9px}h1{font-size:14px}.tools{flex-wrap:wrap;gap:6px}button{padding:7px 10px}.board{padding:10px;height:calc(100dvh - 138px)}.title-block small{font-size:10px}}@media print{header,.tools,footer{display:none}.board{height:auto;overflow:visible;padding:0}.board img{width:100%!important;box-shadow:none}@page{margin:6mm;size:A3 portrait}}
</style></head><body><header><div class="title-block"><h1>完整思路总图 · 相比直接 AI 审查，多了什么？</h1><small>从上往下阅读；可放大并滚动查看全部节点。</small></div><div class="tools"><button type="button" id="fit">适合宽度</button><button type="button" id="minus" aria-label="缩小总图">−</button><output id="zoom" aria-live="polite">100%</output><button type="button" id="plus" aria-label="放大总图">＋</button><a href="overview-map.svg" download="defending-code-overview.svg">下载矢量图</a><a href="index.html#full-map">返回讲解页</a></div></header><div class="board" id="board" role="region" aria-label="完整流程图，可横向和纵向滚动" tabindex="0"><img id="diagram" src="overview-map.svg" alt="Defending Code 完整思路总图。上方比较一次性代码审查与框架，随后展示人与模型分工、八阶段闭环、四项工程支撑、四种定制层次、能力边界、其他分支与后续复用建议。"></div><footer>依据固定提交 d3bea6b 的源码研究 · 未执行漏洞扫描 · 业务迁移为建议</footer><script>
const board=document.getElementById('board'), diagram=document.getElementById('diagram');let zoom=1;
function render(){const padding=window.innerWidth<=600?20:40;diagram.style.width=Math.round((board.clientWidth-padding)*zoom)+'px';document.getElementById('zoom').textContent=Math.round(zoom*100)+'%';document.getElementById('minus').disabled=zoom<=1;document.getElementById('plus').disabled=zoom>=5;}
document.getElementById('fit').addEventListener('click',()=>{zoom=1;render();board.scrollLeft=0;});document.getElementById('minus').addEventListener('click',()=>{zoom=Math.max(1,zoom-.5);render();});document.getElementById('plus').addEventListener('click',()=>{zoom=Math.min(5,zoom+.5);render();});window.addEventListener('resize',render);render();
</script></body></html>
