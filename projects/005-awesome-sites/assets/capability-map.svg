<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Awesome Sites：从视觉效果到具体任务</title><rect width="1200" height="520" fill="#f2f6f9"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#152c3a"><text x="52" y="60" font-size="18" fill="#155be0">005 / AWESOME SITES · 2026-09-15</text><text x="52" y="116" font-size="38" fill="#152c3a">3D 相关产品收集库</text><text x="52" y="154" font-size="19" fill="#546779">80 个目录样例 · 6 个原站查看 · 5 项关键操作验证</text><rect x="52" y="195" width="346" height="213" rx="12" fill="#fff" stroke="#dce4ea"/><text x="77" y="239" font-size="16" fill="#155be0">01 · 观赏与氛围</text><text x="77" y="279" font-size="26" fill="#152c3a">环境、光照、材质</text><text x="77" y="318" font-size="18" fill="#152c3a">Pelagic Ocean / Verdant Forest</text><text x="77" y="373" font-size="17" fill="#546779">确认：海洋天气预设切换</text><rect x="427" y="195" width="346" height="213" rx="12" fill="#fff" stroke="#dce4ea"/><text x="452" y="239" font-size="16" fill="#155be0">02 · 理解与探索</text><text x="452" y="279" font-size="26" fill="#152c3a">导航、内容、参数联动</text><text x="452" y="318" font-size="18" fill="#152c3a">Booktower / Time, Amplified</text><text x="452" y="373" font-size="17" fill="#546779">确认：文字索引与参数结果</text><rect x="802" y="195" width="346" height="213" rx="12" fill="#fff" stroke="#dce4ea"/><text x="827" y="239" font-size="16" fill="#155be0">03 · 明确的小任务</text><text x="827" y="279" font-size="26" fill="#152c3a">输入、编辑、有用结果</text><text x="827" y="318" font-size="18" fill="#152c3a">Garage Mat / Texture Maker</text><text x="827" y="373" font-size="17" fill="#546779">确认：数量联动与图层创建</text><text x="52" y="460" font-size="18" fill="#546779">与已有实践对照，保留效果与交互参考；有明确技术增量再深入。</text></g></svg>