<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">双库共同能力与不同研究重点</title><desc id="desc">两个仓库都是提示词研究资料来源，资料经过提炼和实验才能转化为自己的工作规则。</desc><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#eef3f8}.muted{fill:#adbac8}.lime{fill:#d0f778}.blue{fill:#8fd4fa}.h{font-size:34px;font-weight:600}.p{font-size:25px}.s{font-size:21px}</style><rect width="1400" height="820" fill="#0d141c"/><text x="65" y="65" class="lime s">研究 004 / AI 工具提示词</text><text x="65" y="132" font-size="48" font-weight="600">同一类资料，不同的参考案例。</text><rect x="65" y="190" width="615" height="275" rx="8" fill="#141f2b" stroke="#2c3b4b"/><rect x="720" y="190" width="615" height="275" rx="8" fill="#141f2b" stroke="#2c3b4b"/><path d="M65 193H680" stroke="#d0f778" stroke-width="5"/><path d="M720 193H1335" stroke="#8fd4fa" stroke-width="5"/><text x="96" y="240" class="s lime">本次研究 · 应用与 Agent 案例较突出</text><text x="96" y="295" class="h">x1xhlol</text><text x="96" y="347" class="p">Manus / Kiro / Cursor / Lovable</text><text x="96" y="408" class="s muted">任务流程 · 工具选择 · 交付规则</text><text x="751" y="240" class="s blue">已有研究 · 厂商产品与版本档案较突出</text><text x="751" y="295" class="h">asgeirtj</text><text x="751" y="347" class="p">Claude / ChatGPT / Gemini / Grok</text><text x="751" y="408" class="s muted">版本样本 · 功能模式 · Skills 材料</text><rect x="65" y="493" width="1270" height="88" rx="5" fill="#192a28"/><text x="95" y="548" class="p lime">共同能力</text><text x="295" y="548" class="p">查阅指令　 /　 比较规则　 /　 研究工具　 /　 借鉴流程</text><text x="65" y="648" class="p">资料样本</text><text x="250" y="648" class="lime p">→</text><text x="320" y="648" class="p">提炼规则</text><text x="505" y="648" class="lime p">→</text><text x="575" y="648" class="p">真实任务实验</text><text x="850" y="648" class="lime p">→</text><text x="920" y="648" class="p">决定是否采纳</text><path d="M65 690H1335" stroke="#2c3b4b"/><text x="65" y="739" class="s muted">收录有交叉；资料不等于完整产品。交互案例是教学示意，未调用真实模型。</text><text x="65" y="783" font-size="18" class="muted">依据固定版本目录与代表性样本 · 中文整理与结构图为本研究原创</text></svg>
