<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1740" viewBox="0 0 2000 1740" role="img" aria-labelledby="title desc">
<title id="title">从已有 AI 产品的资料，到理解报告</title>
<desc id="desc">两个仓库收录产品提示词和工具资料；研究者收集资料、解析信息、分析理解，最后整理能力说明、双库对比、案例和证据。x1xhlol 的应用与 Agent 案例较突出，asgeirtj 的厂商产品与版本资料较突出。材料分析不等于产品实测。</desc>
<rect x="0" y="0" width="2000" height="1740" rx="0" fill="#0d141c" stroke="none" stroke-width="2"/>
<text x="70" y="43" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#d0f778" dominant-baseline="text-before-edge">研究 004 / 架构引导图</text>
<text x="70" y="93" font-family="Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#eef3f8" dominant-baseline="text-before-edge">从已有产品的资料，到理解报告</text>
<text x="70" y="177" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" fill="#b9c8d6" dominant-baseline="text-before-edge">依据提示词与工具材料，分析市场上已有 AI 产品的能力描述与工作方式。</text>
<rect x="70" y="245" width="1860" height="124" rx="12" fill="#15222f" stroke="#354758" stroke-width="2"/>
