<text x="104" y="791" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#d0f778" dominant-baseline="text-before-edge">共同能力：收录提示词、工具说明及相关配置，提供可比较的研究材料。</text>
<text x="104" y="830" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#b9c8d6" dominant-baseline="text-before-edge">两库收录有交叉；差异主要在覆盖与组织方式，不是两套不同的分析技术。</text>
