<text x="104" y="632" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#d0f778" dominant-baseline="text-before-edge">偏向：应用与 Agent 产品的工作流程案例</text>
<text x="104" y="688" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#b9c8d6" dominant-baseline="text-before-edge">例如 Manus / Kiro / Cursor：任务、工具、交付</text>
