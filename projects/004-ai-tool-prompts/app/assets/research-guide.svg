<text x="104" y="318" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#b9c8d6" dominant-baseline="text-before-edge">Manus · Kiro · Cursor · Lovable · Claude · ChatGPT · Gemini · Grok …</text>
<text x="1505" y="284" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#91d5fa" dominant-baseline="text-before-edge">产品相关材料</text>
