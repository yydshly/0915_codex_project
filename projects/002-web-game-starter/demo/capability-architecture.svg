<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc">
  <title id="title">web-starter-kit 能力边界与研究结论</title>
  <desc id="desc">核心是需要自行制作或取得的三维模型与舞蹈动作资产。资产适配骨架后，库负责接入、播放与展示，底层依赖 Three.js 等技术。它有工程辅助价值，但不提供人物和舞蹈创作能力，对当前目标参考价值有限。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 8 5 0 9" fill="none" stroke="#90a4bd" stroke-width="1.5"/></marker></defs>
  <rect width="760" height="930" rx="20" fill="#0e1622"/>
  <g font-family="'Microsoft YaHei','Segoe UI',sans-serif">
    <text x="30" y="48" fill="#f3f6fb" font-size="28" font-weight="700">核心在资产，库负责接入与展示</text>
    <text x="30" y="81" fill="#a9b6c8" font-size="18">研究范围：精致人物、舞蹈表现与内容创作工具</text>
    <text x="30" y="124" fill="#f1c478" font-size="19" font-weight="700">01 / 核心投入 · 需自己制作或取得合适资产</text>
    <rect x="30" y="141" width="338" height="146" rx="12" fill="#2a241b" stroke="#aa8548"/>
    <rect x="392" y="141" width="338" height="146" rx="12" fill="#2a241b" stroke="#aa8548"/>
    <text x="50" y="181" fill="#ffe0ac" font-size="24" font-weight="700">3D 人物资产</text>
    <text x="50" y="217" fill="#e7d4b8" font-size="19">造型、贴图、服装、骨骼与蒙皮</text>
    <text x="50" y="251" fill="#e7d4b8" font-size="19">影响人物的精致程度与变形质量</text>
    <text x="412" y="181" fill="#ffe0ac" font-size="24" font-weight="700">舞蹈动作资产</text>
    <text x="412" y="217" fill="#e7d4b8" font-size="19">编舞、关键帧 / 动捕、节奏与修整</text>
    <text x="412" y="251" fill="#e7d4b8" font-size="19">影响动作的丰富度与自然程度</text>
    <path d="M199 287V312H561V287" fill="none" stroke="#90a4bd" stroke-width="2"/>
    <path d="M380 312V332" fill="none" stroke="#90a4bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="135" y="341" width="490" height="55" rx="10" fill="#182231" stroke="#41546b"/>
    <text x="380" y="375" text-anchor="middle" fill="#dce5f1" font-size="20">开发者适配：格式、骨架、比例、动作轨道</text>
    <path d="M380 397V435" fill="none" stroke="#90a4bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="445" width="700" height="178" rx="12" fill="#17332f" stroke="#689d8e"/>
    <text x="50" y="482" fill="#b6edda" font-size="24" font-weight="700">02 / web-starter-kit · 基础工程层</text>
    <text x="50" y="518" fill="#e0f2e9" font-size="21">接入模型 → 播放骨骼动画 → 组织三维展示与交互</text>
    <text x="50" y="554" fill="#b8d4ca" font-size="19">辅助：灯光、物理、音频、界面、资源压缩与加载管理</text>
    <text x="50" y="592" fill="#a4bcba" font-size="18">底层依赖：Three.js / WebGL、React Three Fiber、Rapier 等</text>
    <path d="M380 624V657" fill="none" stroke="#90a4bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="135" y="668" width="490" height="92" rx="12" fill="#1c2940" stroke="#6480a7"/>
    <text x="380" y="705" text-anchor="middle" fill="#d5e5fc" font-size="24" font-weight="700">03 / 浏览器里的角色与舞蹈展示</text>
    <text x="380" y="739" text-anchor="middle" fill="#b5c7de" font-size="18">画面还受灯光与渲染调校影响；优质资产仍是核心</text>
    <rect x="30" y="795" width="700" height="106" rx="12" fill="#211f2d" stroke="#89769a"/>
    <text x="50" y="831" fill="#e6d9f3" font-size="22" font-weight="700">研究结论：对当前目标，参考价值有限</text>
    <text x="50" y="862" fill="#c7bdd4" font-size="18">可按需借鉴工程模块；无法替代人物、动作资产制作与创作编辑器。</text>
    <text x="50" y="887" fill="#c7bdd4" font-size="18">后续重点：人物资产质量、舞蹈资产质量、骨架适配与编辑体验。</text>
  </g>
</svg>
