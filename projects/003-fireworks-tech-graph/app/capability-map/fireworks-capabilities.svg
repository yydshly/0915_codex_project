<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1780"><title>Fireworks 能力全景：输入、处理、图型、场景与输出</title><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563b5"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1800" height="1780" rx="0" fill="#f1f6fa" stroke="#f1f6fa"/><rect x="0" y="0" width="1800" height="165" rx="0" fill="#17324b" stroke="#17324b"/><text x="60" y="66" font-size="44" fill="white" font-weight="700">Fireworks Tech Graph</text><text x="60" y="118" font-size="30" fill="#d5e6f2" font-weight="400">把已理解的系统与关系，制成可交付的技术图</text><text x="60" y="196" font-size="26" fill="#17324b" font-weight="650">01  从材料到成图：大模型理解内容，Fireworks 提供绘图规范与工具</text><rect x="60" y="225" width="360" height="300" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="82" y="247" width="40" height="35" rx="8" fill="#2563b5" stroke="#2563b5"/><text x="93" y="273" font-size="22" fill="white" font-weight="650">1</text><text x="137" y="274" font-size="28" fill="#17324b" font-weight="650">输入材料</text><text x="84" y="319" font-size="23" fill="#536c80" font-weight="400">代码库 / GitHub 仓库</text><text x="84" y="353" font-size="23" fill="#536c80" font-weight="400">文档、需求、自然语言说明</text><rect x="82" y="383" width="316" height="116" rx="10" fill="#edf5fc" stroke="#d8e3eb"/><text x="98" y="417" font-size="23" fill="#17324b" font-weight="600">或：已经整理好的图纸</text><text x="98" y="451" font-size="22" fill="#536c80" font-weight="400">Fireworks 格式 JSON</text><text x="98" y="480" font-size="22" fill="#536c80" font-weight="400">或按其规范编写的 SVG</text><rect x="465" y="225" width="360" height="300" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="487" y="247" width="40" height="35" rx="8" fill="#2563b5" stroke="#2563b5"/><text x="498" y="273" font-size="22" fill="white" font-weight="650">2</text><text x="542" y="274" font-size="28" fill="#17324b" font-weight="650">大模型 / 作者</text><text x="489" y="319" font-size="23" fill="#536c80" font-weight="400">读取源码、文档与证据</text><text x="489" y="356" font-size="23" fill="#536c80" font-weight="400">提取模块、调用、数据关系</text><text x="489" y="393" font-size="23" fill="#536c80" font-weight="400">确定范围，核对事实</text><text x="489" y="430" font-size="23" fill="#536c80" font-weight="400">选择图型、文字与布局</text><text x="489" y="467" font-size="23" fill="#536c80" font-weight="400">写成图纸 JSON 或 SVG</text><rect x="870" y="225" width="430" height="300" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="892" y="247" width="40" height="35" rx="8" fill="#087f78" stroke="#087f78"/><text x="903" y="273" font-size="22" fill="white" font-weight="650">3</text><text x="947" y="274" font-size="28" fill="#17324b" font-weight="650">Fireworks 处理</text><text x="894" y="317" font-size="23" fill="#17324b" font-weight="600">路线 A：图纸 JSON → 渲染 SVG</text><text x="894" y="353" font-size="23" fill="#536c80" font-weight="400">绘制节点、样式、连线与路由</text><text x="894" y="394" font-size="23" fill="#17324b" font-weight="600">路线 B：AI 已编写 SVG → 检查</text><text x="894" y="430" font-size="23" fill="#536c80" font-weight="400">参照图型规范、模板和风格规则</text><text x="894" y="479" font-size="24" fill="#087f78" font-weight="650">两路均可检查、修订、导出</text><rect x="1345" y="225" width="395" height="300" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="1367" y="247" width="40" height="35" rx="8" fill="#2563b5" stroke="#2563b5"/><text x="1378" y="273" font-size="22" fill="white" font-weight="650">4</text><text x="1422" y="274" font-size="28" fill="#17324b" font-weight="650">输出与使用</text><text x="1369" y="321" font-size="23" fill="#536c80" font-weight="400">SVG  · 可编辑矢量源图</text><text x="1369" y="358" font-size="23" fill="#536c80" font-weight="400">PNG  · 文档、汇报、配图</text><text x="1369" y="395" font-size="23" fill="#536c80" font-weight="400">HTML · 离线查看与交互</text><text x="1369" y="432" font-size="23" fill="#536c80" font-weight="400">GIF   · 限定场景的动态演示</text><text x="1369" y="469" font-size="23" fill="#536c80" font-weight="400">附带图纸、布局与检查记录</text><path d="M420 359 H461" fill="none" stroke="#2563b5" stroke-width="3" marker-end="url(#arrow)"/><path d="M825 359 H866" fill="none" stroke="#2563b5" stroke-width="3" marker-end="url(#arrow)"/><path d="M1300 359 H1341" fill="none" stroke="#2563b5" stroke-width="3" marker-end="url(#arrow)"/><path d="M240 525 V587 H1085 V529" fill="none" stroke="#2563b5" stroke-width="3" marker-end="url(#arrow)"/><text x="465" y="578" font-size="23" fill="#2563b5" font-weight="600">已有合规 JSON / SVG，可直接进入处理</text><rect x="60" y="613" width="1680" height="170" rx="16" fill="#e5f0f6" stroke="#cbdfe9"/><text x="84" y="653" font-size="27" fill="#17324b" font-weight="650">怎样控制图？给的是“图纸”，不是随意一份 JSON。</text><text x="84" y="695" font-size="25" fill="#17324b" font-weight="400">内容：节点、文字、分组与关系；布局：坐标、尺寸；外观：图型与风格。</text><text x="84" y="736" font-size="22" fill="#536c80" font-weight="400">常见字段：nodes（id / label / x / y / width / height）、arrows（source / target / label）、mode、style。</text><text x="84" y="767" font-size="22" fill="#536c80" font-weight="400">程序检查：XML、箭头、碰撞、几何、构图；部分工程风格另有领域规则。内容是否真实，仍需作者核实。</text><text x="60" y="837" font-size="29" fill="#17324b" font-weight="700">02  什么时候用哪张图？按固定版本文档整理为 33 个展示条目</text><text x="60" y="873" font-size="24" fill="#536c80" font-weight="400">图型决定表达什么；12 种视觉风格决定长什么样；SVG / PNG / HTML / GIF 是交付形式。</text><rect x="60" y="911" width="540" height="336" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="60" y="911" width="540" height="7" rx="0" fill="#2563b5" stroke="#2563b5"/><text x="82" y="955" font-size="25" fill="#17324b" font-weight="650">通用表达 · 4 项</text><text x="82" y="994" font-size="22" fill="#536c80" font-weight="400">流程图｜说明步骤与条件分支</text><text x="82" y="1025" font-size="22" fill="#536c80" font-weight="400">比较矩阵｜对比方案、功能与取舍</text><text x="82" y="1056" font-size="22" fill="#536c80" font-weight="400">时间轴 / 甘特图｜安排工期与里程碑</text><text x="82" y="1087" font-size="22" fill="#536c80" font-weight="400">思维导图 / 概念图｜整理主题与分支</text><rect x="630" y="911" width="540" height="336" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="630" y="911" width="540" height="7" rx="0" fill="#087f78" stroke="#087f78"/><text x="652" y="955" font-size="25" fill="#17324b" font-weight="650">系统与工程 · 7 项</text><text x="652" y="994" font-size="22" fill="#536c80" font-weight="400">系统架构图｜交代服务与存储分层</text><text x="652" y="1025" font-size="22" fill="#536c80" font-weight="400">C4 评审视图｜评审职责、边界与协议</text><text x="652" y="1056" font-size="22" fill="#536c80" font-weight="400">云部署视图｜说明区域、VPC 与工作负载</text><text x="652" y="1087" font-size="22" fill="#536c80" font-weight="400">事件流视图｜梳理主题、消费与异常出口</text><text x="652" y="1118" font-size="22" fill="#536c80" font-weight="400">可观测性视图｜展示指标与请求追踪</text><text x="652" y="1149" font-size="22" fill="#536c80" font-weight="400">网络拓扑图｜解释设备连接与访问边界</text><text x="652" y="1180" font-size="22" fill="#536c80" font-weight="400">UML 部署图｜说明制品部署到哪些节点</text><rect x="1200" y="911" width="540" height="336" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="1200" y="911" width="540" height="7" rx="0" fill="#2563b5" stroke="#2563b5"/><text x="1222" y="955" font-size="25" fill="#17324b" font-weight="650">数据与结构 · 6 项</text><text x="1222" y="994" font-size="22" fill="#536c80" font-weight="400">数据流图｜追踪数据加工与存储</text><text x="1222" y="1025" font-size="22" fill="#536c80" font-weight="400">ER 实体关系图｜设计实体、键与基数</text><text x="1222" y="1056" font-size="22" fill="#536c80" font-weight="400">对象图｜查看某一时刻的实例关系</text><text x="1222" y="1087" font-size="22" fill="#536c80" font-weight="400">组件图｜说明组件、端口与依赖</text><text x="1222" y="1118" font-size="22" fill="#536c80" font-weight="400">包图｜整理代码包与依赖</text><text x="1222" y="1149" font-size="22" fill="#536c80" font-weight="400">组合结构图｜拆解内部部件与连接器</text><rect x="60" y="1267" width="540" height="336" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="60" y="1267" width="540" height="7" rx="0" fill="#087f78" stroke="#087f78"/><text x="82" y="1311" font-size="25" fill="#17324b" font-weight="650">UML 与行为 · 8 项</text><text x="82" y="1350" font-size="22" fill="#536c80" font-weight="400">时序图｜追踪消息调用的先后顺序</text><text x="82" y="1381" font-size="22" fill="#536c80" font-weight="400">状态机图｜梳理状态与触发事件</text><text x="82" y="1412" font-size="22" fill="#536c80" font-weight="400">类图｜描述类、属性、方法与关系</text><text x="82" y="1443" font-size="22" fill="#536c80" font-weight="400">用例图｜说明角色能使用哪些功能</text><text x="82" y="1474" font-size="22" fill="#536c80" font-weight="400">活动图｜说明并行步骤与汇合</text><text x="82" y="1505" font-size="22" fill="#536c80" font-weight="400">通信图*｜查看对象消息与编号顺序</text><text x="82" y="1536" font-size="22" fill="#536c80" font-weight="400">Timing 波形图*｜观察状态随时间变化</text><text x="82" y="1567" font-size="22" fill="#536c80" font-weight="400">交互概览图*｜组织多个交互片段</text><rect x="630" y="1267" width="540" height="336" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="630" y="1267" width="540" height="7" rx="0" fill="#2563b5" stroke="#2563b5"/><text x="652" y="1311" font-size="25" fill="#17324b" font-weight="650">AI 领域模式 · 8 项</text><text x="652" y="1350" font-size="22" fill="#536c80" font-weight="400">Agent 架构图｜拆解规划、记忆与工具</text><text x="652" y="1381" font-size="22" fill="#536c80" font-weight="400">记忆架构图｜梳理写入、合并与检索</text><text x="652" y="1412" font-size="22" fill="#536c80" font-weight="400">多 Agent 协作图｜解释分工与汇总</text><text x="652" y="1443" font-size="22" fill="#536c80" font-weight="400">工具调用图｜说明调用与结果回传</text><text x="652" y="1474" font-size="22" fill="#536c80" font-weight="400">Agent 记忆分类图｜区分记忆层次</text><text x="652" y="1505" font-size="22" fill="#536c80" font-weight="400">RAG 图｜说明检索如何支撑回答</text><text x="652" y="1536" font-size="22" fill="#536c80" font-weight="400">Agentic RAG 图｜解释自主检索决策</text><text x="652" y="1567" font-size="22" fill="#536c80" font-weight="400">Agentic Search 图｜解释多步搜索策略</text><rect x="1200" y="1267" width="540" height="336" rx="16" fill="#fff" stroke="#d8e3eb"/><rect x="1200" y="1267" width="540" height="7" rx="0" fill="#087f78" stroke="#087f78"/><text x="1222" y="1311" font-size="25" fill="#17324b" font-weight="650">支持边界：不要把数量当成引擎数</text><text x="1222" y="1350" font-size="22" fill="#536c80" font-weight="400">33 = 本次图型与领域变体的整理数</text><text x="1222" y="1381" font-size="22" fill="#536c80" font-weight="400">其中部分名称共享架构 / 数据流记法</text><text x="1222" y="1412" font-size="22" fill="#536c80" font-weight="400">本次展示：15 项由原生 JSON 生成</text><text x="1222" y="1443" font-size="22" fill="#536c80" font-weight="400">另 18 项由 AI 按规范绘制 SVG</text><text x="1222" y="1474" font-size="22" fill="#536c80" font-weight="400">这 18 项中有 3 项近似适配（*）</text><text x="1222" y="1505" font-size="22" fill="#536c80" font-weight="400">不代表 33 个专用自动绘图引擎</text><text x="1222" y="1536" font-size="22" fill="#536c80" font-weight="400">也不代表全部图型都能一键生成 GIF</text><text x="60" y="1666" font-size="29" fill="#17324b" font-weight="650">核心价值：把已经确认的技术关系，转成统一风格、可检查、可复用的图。</text><text x="60" y="1707" font-size="24" fill="#536c80" font-weight="400">源码理解由外部大模型 / 作者完成；原库不是自动读取任意仓库并保证结论正确的代码分析器。</text><text x="60" y="1747" font-size="20" fill="#536c80" font-weight="400">依据：Fireworks 固定提交 31fea364 · 图型规范 / 风格矩阵 / 生成器 · 本图由 AI 编写 SVG 并经原库导出</text></svg>