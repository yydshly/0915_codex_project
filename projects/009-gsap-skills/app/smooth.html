<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="真实 ScrollSmoother 平滑滚动与不同速度的视差演示。"><title>平滑滚动实验</title><link rel="icon" href="favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#edf1e5;color:#35412b;font-family:Arial,"Microsoft YaHei",sans-serif;overscroll-behavior:none}header{position:fixed;z-index:10;top:0;left:0;right:0;padding:12px;display:flex;align-items:center;justify-content:space-between;background:#edf1e5ee;font-size:12px}button{border:1px solid #b9c5a8;background:white;border-radius:5px;padding:6px 9px;color:#35412b;cursor:pointer}button:focus-visible{outline:3px solid #7855bd}section{height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border-bottom:1px dashed #b9c5a8}.blocks{display:flex;gap:20px}.blocks div{width:55px;height:65px;border-radius:13px;display:grid;place-items:center;background:#c1f75a;font-size:12px}.blocks div:nth-child(2){background:#b7a3ed}.blocks div:nth-child(3){background:#d7dfc6}h2{font-size:22px}p{font-size:14px;padding:0 20px;text-align:center}#smooth-content{overflow:visible}#smooth-error{padding-top:60px}
</style><script defer src="vendor/gsap.min.js"></script><script defer src="vendor/ScrollTrigger.min.js"></script><script defer src="vendor/ScrollSmoother.min.js"></script><script defer src="smooth.js"></script></head><body><header><span>SCROLLSMOOTHER / 视差</span><div><button id="smooth-down">向下 ↓</button> <button id="smooth-up">回顶部</button></div></header><div id="smooth-wrapper"><div id="smooth-content"><section><h2>滚动，让画面柔和地跟上。</h2><p>三个方块拥有不同的滚动速度。</p></section><section><div class="blocks"><div data-speed="0.7">0.7×</div><div data-speed="1">1×</div><div data-speed="1.3">1.3×</div></div><p>不同速度，形成远近层次。</p></section><section><h2 data-lag="0.5">慢半拍，也是一种节奏。</h2><p>继续上下滚动，感受滞后追随。</p></section><section><h2>滚动结束，内容也会追上来。</h2><p>点击上方按钮可以回到顶部。</p></section></div></div><p id="smooth-error" hidden role="alert">平滑滚动组件未能加载，请刷新重试。</p></body></html>
